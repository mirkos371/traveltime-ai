name: Sync AI context to Google Docs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '**/*.py'
      - ai-export-manifest.json
      - .github/workflows/sync-google-doc.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: traveltime-ai-google-doc
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google API dependencies
        run: python -m pip install google-api-python-client google-auth
      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/476000268062/locations/global/workloadIdentityPools/traveltime-github/providers/github-actions
          service_account: traveltime-sync@white-might-296016.iam.gserviceaccount.com
      - name: Publish and verify AI snapshot
        env:
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
        run: python tools/sync_google_doc.py
